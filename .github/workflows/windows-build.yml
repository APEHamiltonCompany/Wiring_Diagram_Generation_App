name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller openpyxl python-docx

      - name: Rebuild device database
        run: python app/drd.py
        continue-on-error: true

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean wirediagram.spec

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireDiagramBuilder-windows
          path: dist/WireDiagramBuilder.exe
          if-no-files-found: error
